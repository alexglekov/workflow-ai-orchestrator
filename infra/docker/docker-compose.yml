services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-worker-postgres
    restart: unless-stopped
    ports:
      - '5436:5432'
    environment:
      POSTGRES_USER: aiworker
      POSTGRES_PASSWORD: aiworker
      POSTGRES_DB: aiworker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aiworker -d aiworker']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
